<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <!--
    Moldura (Bezel/Overlay) 1920x1080 para vídeos 4:3 (janela central 1440x1080 transparente)
    Baseado na Logo Oficial SKIMBOLL (20 ▽S 01, Vermelho #D21D1D e Amarelo #F4E600)
  -->

  <!-- ==================== BARRA LATERAL ESQUERDA (240x1080) ==================== -->
  <rect x="0" y="0" width="240" height="1080" fill="#D21D1D"/>
  <rect x="0" y="940" width="240" height="140" fill="#B41919"/>
  <rect x="10" y="12" width="220" height="1056" fill="none" stroke="#F4E600" stroke-width="4"/>
  <line x1="238" y1="0" x2="238" y2="1080" stroke="#F4E600" stroke-width="6"/>

  <!-- 20 e 01 no topo -->
  <text x="24" y="46" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#F4E600">20</text>
  <text x="216" y="46" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#F4E600" text-anchor="end">01</text>

  <!-- Triângulo Invertido Oficial + S -->
  <polygon points="55,60 185,60 120,180" fill="none" stroke="#F4E600" stroke-width="10"/>
  <text x="120" y="132" font-family="'Arial Black', sans-serif" font-size="52" font-weight="900" fill="#F4E600" text-anchor="middle">S</text>

  <text x="120" y="228" font-family="'Courier New', monospace" font-size="32" font-weight="900" fill="#F4E600" text-anchor="middle" letter-spacing="2">SKIMBOLL</text>

  <g font-family="'Courier New', monospace" font-size="15" font-weight="900" fill="#F4E600" text-anchor="middle">
    <text x="120" y="275">Skimboll desde 2001</text>
    <text x="120" y="302">Skimboll seit 2001</text>
    <text x="120" y="329">Skimboll since 2001</text>
    <text x="120" y="360">Skimboll 自 2001 年</text>
  </g>

  <!-- ==================== BARRA LATERAL DIREITA (240x1080) ==================== -->
  <rect x="1680" y="0" width="240" height="1080" fill="#D21D1D"/>
  <rect x="1680" y="940" width="240" height="140" fill="#B41919"/>
  <rect x="1690" y="12" width="220" height="1056" fill="none" stroke="#F4E600" stroke-width="4"/>
  <line x1="1682" y1="0" x2="1682" y2="1080" stroke="#F4E600" stroke-width="6"/>

  <!-- Caixa da Versão/ROM no topo direito -->
  <text x="1800" y="70" font-family="'Courier New', monospace" font-size="22" font-weight="900" fill="#F4E600" text-anchor="middle">ISS DELUXE</text>
  <line x1="1715" y1="88" x2="1885" y2="88" stroke="#F4E600" stroke-width="3"/>
  <text x="1800" y="122" font-family="'Courier New', monospace" font-size="18" font-weight="900" fill="#F4E600" text-anchor="middle">16-BIT • 4:3</text>

  <!-- Rodapé direito -->
  <text x="1800" y="1015" font-family="'Courier New', monospace" font-size="20" font-weight="900" fill="#F4E600" text-anchor="middle" letter-spacing="1.5">
    @SKIMBOLL2001
  </text>
</svg>
