<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <!-- Fundo Vermelho Oficial Skimboll (#D21D1D) e faixa inferior (#B41919) -->
  <rect width="2560" height="1440" fill="#D21D1D"/>
  <rect x="0" y="1220" width="2560" height="220" fill="#B41919"/>

  <!-- Linhas sutis de campo em amarelo para TV -->
  <g stroke="#F4E600" stroke-opacity="0.18" stroke-width="5" fill="none">
    <rect x="140" y="90" width="2280" height="1260"/>
    <line x1="1280" y1="90" x2="1280" y2="1350"/>
    <circle cx="1280" cy="720" r="290"/>
  </g>

  <!-- ÁREA SEGURA DO YOUTUBE (1546x423 centralizada: x=507, y=508) -->
  <rect x="507" y="508" width="1546" height="423" fill="#D21D1D" stroke="#F4E600" stroke-width="6"/>
  <rect x="513" y="855" width="1534" height="70" fill="#B41919"/>

  <!-- "20" e "01" nos cantos superiores da área segura -->
  <text x="542" y="562" font-family="'Courier New', monospace" font-size="38" font-weight="900" fill="#F4E600" letter-spacing="2">20</text>
  <text x="2018" y="562" font-family="'Courier New', monospace" font-size="38" font-weight="900" fill="#F4E600" text-anchor="end" letter-spacing="2">01</text>

  <!-- Logo Oficial Triângulo Invertido + S à esquerda da área segura -->
  <g transform="translate(650, 545)">
    <polygon points="0,0 220,0 110,205" fill="none" stroke="#F4E600" stroke-width="15"/>
    <text x="110" y="118" font-family="'Arial Black', Impact, sans-serif" font-size="88" font-weight="900" fill="#F4E600" text-anchor="middle">S</text>
  </g>

  <!-- Nome SKIMBOLL e Lema Multilíngue à direita -->
  <text x="1420" y="645" font-family="'Courier New', 'Arial Black', monospace" font-size="96" font-weight="900" fill="#F4E600" text-anchor="middle" letter-spacing="8">
    SKIMBOLL
  </text>

  <text x="1420" y="705" font-family="'Courier New', monospace" font-size="27" font-weight="900" fill="#F4E600" text-anchor="middle" letter-spacing="1.5">
    desde 2001 • seit 2001 • since 2001 • 自 2001 年
  </text>

  <!-- Jogos do Canal -->
  <rect x="940" y="740" width="960" height="58" fill="#B41919" stroke="#F4E600" stroke-width="3"/>
  <text x="1420" y="779" font-family="'Courier New', monospace" font-size="28" font-weight="900" fill="#F4E600" text-anchor="middle" letter-spacing="2">
    ISS DELUXE (SNES) • eFOOTBALL • EA SPORTS FC • FIFA
  </text>

  <!-- Rodapé da Área Segura -->
  <text x="1280" y="901" font-family="'Courier New', monospace" font-size="25" font-weight="900" fill="#F4E600" text-anchor="middle" letter-spacing="3">
    GAMEPLAYS &amp; TORNEIOS • SÓBRIO E SEM FRUFRU • PARA TODAS AS IDADES
  </text>
</svg>
