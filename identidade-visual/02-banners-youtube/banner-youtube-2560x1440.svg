<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="redBanner" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6A0B0B"/>
      <stop offset="50%" stop-color="#B71C1C"/>
      <stop offset="100%" stop-color="#6A0B0B"/>
    </linearGradient>
  </defs>

  <!-- Fundo 2560x1440 todo em Vermelho Profundo -->
  <rect width="2560" height="1440" fill="url(#redBanner)"/>

  <!-- Marcação de Campo de Futebol em Amarelo Ouro ao fundo (TV) -->
  <g stroke="#FFD600" stroke-opacity="0.22" stroke-width="6" fill="none">
    <rect x="160" y="100" width="2240" height="1240" rx="16"/>
    <line x1="1280" y1="100" x2="1280" y2="1340"/>
    <circle cx="1280" cy="720" r="280"/>
    <!-- Grandes áreas -->
    <rect x="160" y="420" width="320" height="600"/>
    <rect x="2080" y="420" width="320" height="600"/>
  </g>

  <!-- ÁREA SEGURA DO YOUTUBE (1546x423 centralizada: x=507, y=508) -->
  <!-- Moldura estilo caixa de menu clássico do ISS Deluxe em Vermelho Escuro + Borda Dupla Amarelo Ouro -->
  <rect x="507" y="508" width="1546" height="423" rx="14" fill="#7F0000" fill-opacity="0.95" stroke="#FFD600" stroke-width="8"/>
  <rect x="523" y="524" width="1514" height="391" rx="8" fill="none" stroke="#FFAB00" stroke-width="3"/>

  <!-- Faixas laterais amarelas internas -->
  <rect x="535" y="536" width="18" height="367" fill="#FFD600"/>
  <rect x="2007" y="536" width="18" height="367" fill="#FFD600"/>

  <!-- Estrelas amarelas no topo da área segura -->
  <polygon points="1280,545 1290,573 1320,573 1296,590 1305,618 1280,601 1255,618 1264,590 1240,573 1270,573" fill="#FFD600"/>
  <polygon points="1210,565 1216,582 1234,582 1220,592 1225,609 1210,599 1195,609 1200,592 1186,582 1204,582" fill="#FFD600"/>
  <polygon points="1350,565 1356,582 1374,582 1360,592 1365,609 1350,599 1335,609 1340,592 1326,582 1344,582" fill="#FFD600"/>

  <!-- Título Principal do Canal -->
  <text x="1280" y="720" font-family="'Russo One', 'Chakra Petch', 'Arial Black', sans-serif" font-size="114" font-weight="900" fill="#FFD600" text-anchor="middle" letter-spacing="6">
    SKIMBOLL<tspan fill="#FFFFFF">2001</tspan>
  </text>

  <!-- Linha divisória em Amarelo Ouro -->
  <line x1="760" y1="752" x2="1800" y2="752" stroke="#FFD600" stroke-width="5"/>

  <!-- Subtítulo: Jogo e proposta -->
  <text x="1280" y="808" font-family="'Segoe UI', Arial, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="4">
    INTERNATIONAL SUPERSTAR SOCCER DELUXE &amp; VARIAÇÕES
  </text>

  <!-- Plaqueta inferior estilo placar de SNES -->
  <rect x="850" y="832" width="860" height="52" rx="6" fill="#B71C1C" stroke="#FFD600" stroke-width="3"/>
  <text x="1280" y="867" font-family="'Courier New', monospace" font-size="26" font-weight="900" fill="#FFD600" text-anchor="middle" letter-spacing="4">
    ★ SNES 16-BIT • SÓBRIO &amp; DIVERTIDO • PARA TODOS ★
  </text>
</svg>
